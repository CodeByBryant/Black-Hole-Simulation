name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          libgl1-mesa-dev \
          libglfw3-dev \
          libglew-dev \
          libglm-dev \
          pkg-config \
          xorg-dev \
          libx11-dev \
          libxrandr-dev \
          libxi-dev
    
    - name: Create build directory
      run: mkdir -p build
    
    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: cmake --build build --config Release -j $(nproc)
    
    - name: Check executable exists
      run: |
        if [ ! -f build/blackhole_sim ]; then
          echo "Error: Executable not found"
          exit 1
        fi
        echo "Build successful!"
        ls -lh build/blackhole_sim
